{{- $perCluster := div .Values.replicas (len .Values.karmada.targetClusters) }}
{{- $primary := index .Values.canary.clusters 0 }}
{{- $fullname := include "app.fullname" . }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ $fullname }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ $fullname }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  revisionHistoryLimit: {{ .Values.rollout.revisionHistoryLimit }}
  rollbackWindow:
    revisions: {{ .Values.rollout.rollbackWindow.revisions }}
  replicas: {{ $perCluster }}
  selector:
    matchLabels:
      app: {{ $fullname }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: {{ $fullname }}
      labels:
        app: {{ $fullname }}
    spec:
      {{- if or .Values.mesh.enabled .Values.consulAgent.enabled .Values.vaultAgent.enabled .Values.opa.enabled }}
      initContainers:
        {{- if .Values.mesh.enabled }}
        - name: mesh
          image: alpine:3
          command: ["sleep", "infinity"]
          restartPolicy: Always
        {{- end }}
        {{- if or .Values.consulAgent.enabled .Values.opa.enabled }}
        - name: consul
          image: alpine:3
          command: ["sleep", "infinity"]
          restartPolicy: Always
        {{- end }}
        {{- if .Values.vaultAgent.enabled }}
        - name: vault
          image: alpine:3
          command: ["sleep", "infinity"]
          restartPolicy: Always
        {{- end }}
        {{- if .Values.opa.enabled }}
        - name: opa
          image: alpine:3
          command: ["sleep", "infinity"]
          restartPolicy: Always
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $fullname }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.env }}
          env:
{{- toYaml .Values.env | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
  strategy:
    canary:
      analysis:
        templates:
          - templateName: canary-readiness
            clusterScope: true
        startingStep: {{ $primary.analysisStartingStep }}
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
          - name: namespace
            value: {{ .Values.namespace }}
      steps:
        {{- range $primary.steps }}
        - setWeight: {{ . }}
        - pause: {}
        {{- end }}
